pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;
        autoindex off;
        location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
        location ~ /\. { return 404; }
        location ~* \.(?:map|conf|ya?ml|sql|bak|pem|key)$ { return 404; }
        location = /api { return 404; }
        location ^~ /api/ { return 404; }
        location = /index.html { add_header Cache-Control "no-store" always; }
        location ~ ^/assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|mp3|mp4)$ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=3600";
        }
        location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
    }
}
