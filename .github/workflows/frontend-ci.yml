name: Frontend CI Pipeline

on:
  push:
    branches: [ "main", "feature", "develop" ]
  pull_request:
    branches: [ "main", "feature", "develop" ]
  workflow_dispatch:

jobs:
  ci-store-owner:
    name: "CI - HA_Store Owner Portal"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './HA_Store Owner/package-lock.json'
      - name: Install Dependencies
        working-directory: './HA_Store Owner'
        run: npm ci
      - name: Build Store Owner Frontend
        working-directory: './HA_Store Owner'
        run: npm run build

  ci-admin-portal:
    name: "CI - HA_ADMIN Portal"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './HA_ADMIN/package-lock.json'
      - name: Install Dependencies
        working-directory: './HA_ADMIN'
        run: npm ci
      - name: Build Admin Frontend
        working-directory: './HA_ADMIN'
        run: npm run build
