name: Production CD

on:
  push:
    branches:
      - main

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: [self-hosted, linux, x64, hoian-production]
    timeout-minutes: 35

    steps:
      - name: Deploy application
        shell: bash
        run: /home/superadmin/deploy-ha-app.sh
