pid /tmp/nginx.pid;
# Nginx error messages may include raw request/query; keep sensitive URLs out of logs.
error_log /dev/null;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    map $http_origin $cors_origin {
        default "";
        "https://ha-user.buivietquangvinh.xyz" $http_origin;
        "https://ha-admin.buivietquangvinh.xyz" $http_origin;
        "https://ha-owner.buivietquangvinh.xyz" $http_origin;
    }
    map $cors_origin $cors_credentials { default "true"; "" ""; }
    map $request_method $sensitive_key { default $binary_remote_addr; OPTIONS ""; }
    map $uri $route_group {
        default other;
        ~^/api/auth/ auth;
        /api/payments payment_create;
        /api/payments/claim payment_claim;
        ~^/api/payments/[^/]+/status$ payment_status;
        /api/payments/vnpay/ipn ipn;
        /healthz health;
    }
    log_format safe '$time_iso8601 client=$remote_addr peer=$realip_remote_addr vhost=$server_name group=$route_group status=$status rate=$limit_req_status upstream=$upstream_status rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    include /etc/nginx/edge/trusted-proxies.conf;
    resolver 127.0.0.11 valid=10s ipv6=off;
    limit_req_zone $api_key zone=api_limit:10m rate=30r/m;
    limit_req_zone $sensitive_key zone=auth_limit:10m rate=10r/m;
    limit_req_zone $sensitive_key zone=payment_limit:10m rate=10r/m;
    # Provisional: must be reviewed against provider retries/traffic before production.
    limit_req_zone $binary_remote_addr zone=ipn_limit:10m rate=120r/m;
    # Separate finite polling bucket: a 3-second poll must not consume the ordinary API budget.
    limit_req_zone $binary_remote_addr zone=poll_limit:10m rate=120r/m;
    map $request_method $api_key { default $binary_remote_addr; OPTIONS ""; }
    map $request_method $preflight_key { default ""; OPTIONS $binary_remote_addr; }
    limit_req_zone $preflight_key zone=options_limit:10m rate=120r/m;
    limit_req_status 429;
    limit_req_log_level notice;
    server {
        listen 80 default_server;
        server_name _;
        location = /healthz { access_log off; return 200 "ok\n"; }
        location / { return 404; }
    }
    server {
        listen 80;
        server_name ha-user.buivietquangvinh.xyz;
        location = /healthz { access_log off; return 200 "ok\n"; }
        location / {
            set $frontend http://hoian-frontend-user:80;
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass $frontend;
        }
    }
    server {
        listen 80;
        server_name ha-admin.buivietquangvinh.xyz;
        location = /healthz { access_log off; return 200 "ok\n"; }
        location / {
            set $frontend http://hoian-frontend-admin:80;
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass $frontend;
        }
    }
    server {
        listen 80;
        server_name ha-owner.buivietquangvinh.xyz;
        location = /healthz { access_log off; return 200 "ok\n"; }
        location / {
            set $frontend http://hoian-frontend-owner:80;
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass $frontend;
        }
    }
    server {
        listen 80;
        server_name api.buivietquangvinh.xyz;
        set $backend http://app:8080;
        client_max_body_size 20m;
        # One CORS header owner; upstream still decides whether OPTIONS is allowed.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials $cors_credentials always;
        add_header Vary Origin always;
        error_page 429 = @rate_limited;
        location @rate_limited {
            internal;
            default_type application/json;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials $cors_credentials always;
            add_header Vary Origin always;
            add_header Retry-After 6 always;
            return 429 '{"message":"Too many requests"}';
        }
        location = /healthz { access_log off; return 200 "ok\n"; }
        # Every other API-host path is protected, including uploads and unknown paths.
        location / {
            limit_req zone=api_limit burst=5 nodelay;
            limit_req zone=options_limit burst=20 nodelay;
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass $backend;
        }
        location ~ ^/api/auth/(?:login|register(?:/.*)?)/?$ {
            limit_req zone=api_limit burst=5 nodelay;
            limit_req zone=options_limit burst=20 nodelay;
            limit_req zone=auth_limit burst=3 nodelay;
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass $backend;
        }
        location = /api/payments {
            limit_req zone=api_limit burst=5 nodelay;
            limit_req zone=options_limit burst=20 nodelay;
            limit_req zone=payment_limit burst=2 nodelay;
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass $backend;
        }
        location = /api/payments/claim {
            limit_req zone=api_limit burst=5 nodelay;
            limit_req zone=payment_limit burst=2 nodelay;
            limit_req zone=options_limit burst=20 nodelay;
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass $backend;
        }
        location ~ ^/api/payments/[^/]+/status$ {
            limit_req zone=poll_limit burst=10 nodelay;
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass $backend;
        }
        # Separate finite bucket so user traffic cannot starve payment callbacks.
        location = /api/payments/vnpay/ipn {
            limit_req zone=ipn_limit burst=20 nodelay;
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass $backend;
        }
    }
}
