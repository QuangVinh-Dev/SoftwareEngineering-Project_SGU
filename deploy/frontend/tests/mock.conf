pid /tmp/nginx.pid;
error_log /dev/null;
events {}
http {
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    map "$request_method:$http_origin" $deny_preflight {
        default 0;
        ~^OPTIONS:https://ha-(user|admin|owner)\.buivietquangvinh\.xyz$ 0;
        ~^OPTIONS: 1;
    }
    server {
        listen 8080;
        default_type application/json;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
        add_header Access-Control-Allow-Headers "authorization,content-type,x-service-token,x-payment-claim-secret" always;
        if ($deny_preflight) { return 403; }
        location / {
            if ($request_method = OPTIONS) { return 204; } return 200 '{"service":"isolated-api-fixture"}'; }
    }
}
