services:
  postgres:
    image: postgres:16
    container_name: hoian-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hoian_db}
      POSTGRES_USER: ${POSTGRES_USER:-hoian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./hoian_database.sql:/docker-entrypoint-initdb.d/01-hoian_database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: hoian-redis
    restart: unless-stopped
    command:
      - redis-server
      - --port
      - "6380"
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD}"
    ports:
      - "127.0.0.1:6380:6380"
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli -p 6380 ping | grep -q PONG'
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: hoian-libretranslate
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: "en,vi,ja,ko,zh"
    expose:
      - "5000"
    volumes:
      - libretranslate_models:/home/libretranslate/.local
    networks:
      - backend

  piper-tts:
    build:
      context: ./tts-service
      dockerfile: Dockerfile
    container_name: hoian-piper-tts
    restart: unless-stopped
    environment:
      MODEL_DIR: /models
      PIPER_MODEL_VI: "vi_VN-vais1000-medium.onnx"
      PIPER_MODEL_EN: "en_US-lessac-medium.onnx"
      PIPER_MODEL_JA: "ja_JP-hi_fi_captain-medium.onnx"
      PIPER_MODEL_KO: "ko_KR-kss-medium.onnx"
      PIPER_MODEL_ZH: "zh_CN-huayan-medium.onnx"
    expose:
      - "5001"
    volumes:
      - ./tts-service/models:/models:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=3)"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  app:
    container_name: hoian-app
    restart: unless-stopped
    ports:
      - "9999:8080"
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    init: true
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hoian_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-hoian}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6380
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}

      SPRING_JPA_HIBERNATE_DDL_AUTO: validate

      LIBRETRANSLATE_URL: http://libretranslate:5000
      PIPER_TTS_URL: http://piper-tts:5001
      AUDIO_STORAGE_PATH: /app/uploads/audio
      POI_IMAGE_STORAGE_PATH: /app/uploads/audio/poi-images

      # --- JWT / token: giá trị lấy từ file .env cạnh docker-compose.yml ---
      # Thiếu JWT_SECRET thì compose báo lỗi ngay, không chạy với secret yếu.
      JWT_SECRET: ${JWT_SECRET:?Thiếu JWT_SECRET - copy .env.example thành .env rồi điền giá trị}
      JWT_ISSUER: ${JWT_ISSUER:-hoian-api}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}

      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_SUPER_ADMIN_PASSWORD: ${APP_SUPER_ADMIN_PASSWORD:-}
      APP_SEED_MERCHANT_PASSWORD: ${APP_SEED_MERCHANT_PASSWORD:?Set APP_SEED_MERCHANT_PASSWORD in .env}
      APP_PROXY_TRUSTED_PROXIES: ${APP_PROXY_TRUSTED_PROXIES:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:5175}

      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}

      VNPAY_PAYMENT_URL: ${VNPAY_PAYMENT_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-}
      VNPAY_IPN_URL: ${VNPAY_IPN_URL:-}

    volumes:
      - ./Data_Storage:/app/uploads/audio
    networks:
      - backend

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      libretranslate:
        condition: service_started
      piper-tts:
        condition: service_healthy
    # No application healthcheck is configured: the Spring app has no health endpoint/dependency.

  # Chỉ sửa phần Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: hoian-cloudflared
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --protocol
      - http2
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      app:
        condition: service_started
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  libretranslate_models:
