# Test configuration - in-memory DB, dummy secrets
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Redis dummy (no server needed for tests)
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=

# JWT dummy secret
app.jwt.secret=dummy-secret
app.jwt.issuer=ha-app-test
app.jwt.expiration-minutes=60

# Admin passwords dummy
APP_ADMIN_PASSWORD=admin
APP_SUPER_ADMIN_PASSWORD=superadmin
APP_SEED_MERCHANT_PASSWORD=merchant
