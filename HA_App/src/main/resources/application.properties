spring.application.name=HA_App

server.port=8080

# =========================
# PostgreSQL
# =========================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/hoian_db}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:hoian}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:hoian123}

spring.datasource.driver-class-name=org.postgresql.Driver


# =========================
# JPA
# =========================

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true
spring.session.jdbc.initialize-schema=always

# =========================
# Redis
# =========================

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.password=#0869691234quynhheo#

# Local audio files; set AUDIO_STORAGE_PATH in Docker/production.
app.audio.storage-path=${AUDIO_STORAGE_PATH:./Data_Storage}
audio.storage-path=${AUDIO_STORAGE_PATH:./Data_Storage}
app.poi-image.storage-path=${POI_IMAGE_STORAGE_PATH:./Data_Storage/poi-images}
audio.public-url-prefix=/uploads/audio
services.libretranslate-url=${LIBRETRANSLATE_URL:http://localhost:5000}
services.piper-tts-url=${PIPER_TTS_URL:http://localhost:5001}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# =========================
# JWT authentication
# =========================
# Replace this development-only fallback through JWT_SECRET before deployment.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.jwt.issuer=${JWT_ISSUER:hoian-api}

# Comma-separated frontend origins (Vite defaults for the two portals).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Development-only bootstrap password for the pre-seeded admin account.
app.seed.admin-password=${APP_ADMIN_PASSWORD:}
app.seed.super-admin-password=${APP_SUPER_ADMIN_PASSWORD:123456}

# VnPay
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.payment-url=${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:}
vnpay.ipn-url=${VNPAY_IPN_URL:}
