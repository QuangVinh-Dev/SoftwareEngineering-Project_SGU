spring.application.name=HA_App

server.port=8080

# =========================
# PostgreSQL
# =========================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/hoian_db}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:hoian}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:hoian123}

spring.datasource.driver-class-name=org.postgresql.Driver


# =========================
# JPA
# =========================

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true
spring.session.jdbc.initialize-schema=always

# =========================
# Redis
# =========================

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}

spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Local audio files; set AUDIO_STORAGE_PATH in Docker/production.
app.audio.storage-path=${AUDIO_STORAGE_PATH:/home/qvinh/Workspace/SoftwareEngineering-Project_SGU/Test}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# =========================
# JWT authentication
# =========================
# Replace this development-only fallback through JWT_SECRET before deployment.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.jwt.issuer=${JWT_ISSUER:hoian-api}

# Comma-separated frontend origins (Vite defaults for the two portals).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Development-only bootstrap password for the pre-seeded admin account.
app.seed.admin-password=${APP_ADMIN_PASSWORD:}
